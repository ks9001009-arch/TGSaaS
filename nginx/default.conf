# Reverse proxy: routes /api -> NestJS backend, everything else -> Next.js
#
# Production note: terminate HTTPS at the host reverse proxy (宝塔/Cloudflare).
# This container should only listen on 127.0.0.1.

upstream api_upstream {
    server api:4000;
}

upstream web_upstream {
    server web:3000;
}

# Login brute-force blunt
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
# General API rate limit
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
# Webhook flood blunt (Telegram retries; keep generous)
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    server_tokens off;

    # Baseline hardening headers (HSTS is terminated at 宝塔 HTTPS)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Tight CSP for the admin UI (API is same-origin under /api).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Server-Sent Events stream for live permission sync (no buffering)
    location /api/events {
        proxy_pass http://api_upstream/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # Auth endpoints: stricter rate limit
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api_upstream/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (strip the /api prefix before forwarding)
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Telegram webhooks hit the backend directly under /webhook/*
    location /webhook/ {
        limit_req zone=webhook_limit burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api_upstream/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
