name: telegram_manager

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      API_PORT: ${API_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PUBLIC_URL: ${PUBLIC_URL}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME}
      WEBHOOK_URL: ${WEBHOOK_URL}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      AI_RISK_PROVIDER: ${AI_RISK_PROVIDER}
      AI_RISK_API_KEY: ${AI_RISK_API_KEY}
      # Listener Center (MTProto) integration
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LISTENER_URL: ${LISTENER_URL:-http://listener:8100}
      LISTENER_TOKEN: ${LISTENER_TOKEN}
    expose:
      - "${API_PORT:-4000}"
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    expose:
      - "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Python (Telethon) MTProto listener — real Telegram accounts (NOT bot tokens).
  listener:
    build:
      context: ./apps/listener
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      LISTENER_PORT: ${LISTENER_PORT:-8100}
      LISTENER_TOKEN: ${LISTENER_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_DIR: /sessions
    expose:
      - "${LISTENER_PORT:-8100}"
    volumes:
      - listener_sessions:/sessions

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  redisdata:
  listener_sessions:
